name: Standalone binary

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ci
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Runs on every build but only creates the GitHub release on a v* tag.
  # Platform jobs depend on it so the release exists before they upload.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # -dev<N> tags are pre-releases; other v* tags are full releases.
        [[ "$GITHUB_REF_NAME" =~ -dev[0-9]+ ]] && pre=--prerelease || pre=
        # Idempotent: skip create if it already exists (e.g. on a re-run).
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $pre --generate-notes

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Alpine (musl) so the broker links fully statically.
    - name: Build static mosquitto
      run: |
        docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh -ec '
          apk add --no-cache build-base cmake ninja linux-headers \
            openssl-dev openssl-libs-static sqlite-dev sqlite-static git
          git clone --depth 1 -b v1.7.18 https://github.com/DaveGamble/cJSON /tmp/cjson
          cmake -S /tmp/cjson -B /tmp/cjson/b -G Ninja -DBUILD_SHARED_LIBS=OFF -DENABLE_CJSON_TEST=OFF -DCMAKE_INSTALL_PREFIX=/opt/cjson
          cmake --build /tmp/cjson/b --target install
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=ON -DCMAKE_PREFIX_PATH=/opt/cjson \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=/src/build/bin \
            -DWITH_STATIC_LIBRARIES=ON \
            -DWITH_TESTS=OFF -DWITH_DOCS=OFF
          cmake --build build
          strip build/bin/*
          build/bin/mosquitto -h | head -3
        '

    - name: Package
      run: |
        mkdir mosquitto-standalone
        cp build/bin/* mosquitto.conf LICENSE.txt mosquitto-standalone/
        file mosquitto-standalone/mosquitto || true

    - uses: actions/upload-artifact@v4
      with:
        name: mosquitto-linux-x86_64
        path: mosquitto-standalone

    - name: Upload to release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        (cd mosquitto-standalone && zip -r "$GITHUB_WORKSPACE/mosquitto-linux-x86_64.zip" .)
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber mosquitto-linux-x86_64.zip

  macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Static cJSON + static OpenSSL so the binary has no Homebrew dylib deps.
    - name: Build mosquitto
      run: |
        git clone --depth 1 -b v1.7.18 https://github.com/DaveGamble/cJSON /tmp/cjson
        cmake -S /tmp/cjson -B /tmp/cjson/b -G Ninja -DBUILD_SHARED_LIBS=OFF -DENABLE_CJSON_TEST=OFF \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX=/tmp/cjson-inst
        cmake --build /tmp/cjson/b --target install
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=ON \
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) -DCMAKE_PREFIX_PATH=/tmp/cjson-inst \
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$PWD/build/bin -DWITH_STATIC_LIBRARIES=ON \
          -DWITH_TESTS=OFF -DWITH_DOCS=OFF
        cmake --build build
        strip build/bin/*
        otool -L build/bin/mosquitto
        build/bin/mosquitto -h | head -3

    - name: Package
      run: |
        mkdir mosquitto-standalone
        cp build/bin/* mosquitto.conf LICENSE.txt mosquitto-standalone/

    - uses: actions/upload-artifact@v4
      with:
        name: mosquitto-macos-arm64
        path: mosquitto-standalone

    - name: Upload to release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        (cd mosquitto-standalone && zip -r "$GITHUB_WORKSPACE/mosquitto-macos-arm64.zip" .)
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber mosquitto-macos-arm64.zip

  windows:
    needs: create-release
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: ilammy/msvc-dev-cmd@v1

    # Static triplet: no OpenSSL/cJSON/CRT DLLs needed next to the exe.
    - name: Install dependencies
      working-directory: ${{ runner.temp }}  # outside repo: vcpkg.json there forces manifest mode
      run: vcpkg install --triplet x64-windows-static openssl cjson sqlite3 pthreads dlfcn-win32

    - name: Build mosquitto
      run: |
        cmake -S . -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DWITH_SHARED_LIBCOMMON=OFF `
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build/bin" -DWITH_STATIC_LIBRARIES=ON `
          -DWITH_TESTS=OFF -DWITH_DOCS=OFF
        cmake --build build
        dumpbin /dependents build/bin/mosquitto.exe
        build/bin/mosquitto.exe -h 2>&1 | Select-Object -First 3
        Write-Host "exit code: $LASTEXITCODE"
        $global:LASTEXITCODE = 0

    - name: Package
      run: |
        mkdir mosquitto-standalone
        cp build/bin/*.exe, mosquitto.conf, LICENSE.txt mosquitto-standalone/

    - uses: actions/upload-artifact@v4
      with:
        name: mosquitto-windows-x64
        path: mosquitto-standalone

    - name: Upload to release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        Compress-Archive -Path mosquitto-standalone/* -DestinationPath mosquitto-windows-x64.zip
        gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber mosquitto-windows-x64.zip
